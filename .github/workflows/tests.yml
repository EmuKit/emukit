name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core_tests:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.15"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[tests]
    - name: Unit tests (core)
      run: |
        python -m pytest tests
    - name: Integration tests (core)
      run: |
        pip install .[integration-tests,examples]
        python -m pytest integration_tests

  os_versions:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: 'pyproject.toml'
    - name: Install dependencies (core)
      run: |
        python -m pip install --upgrade pip
        pip install .[tests]
    - name: Unit tests (core, multi-OS)
      run: |
        python -m pytest tests

  all-pass:
    if: always()
    needs: [core_tests, os_versions]

    runs-on: ubuntu-latest

    steps:
      - name: Check all tests pass
        run: |
          if [[ "${{ needs.core_tests.result }}" != "success" && "${{ needs.core_tests.result }}" != "skipped" ]] || \
             [[ "${{ needs.os_versions.result }}" != "success" && "${{ needs.os_versions.result }}" != "skipped" ]]; then
            echo "One or more test jobs failed"
            exit 1
          fi
